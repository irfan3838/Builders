- id: t1_raise_ticket
  tier: 1
  who: employee
  turns:
    - say: "the AC in the meeting room is not working, please raise a ticket"
      expect: {tools_any: [propose_ticket], cards_any: [proposal], writes: 0}
    - say: "haan kar do"
      expect: {tools_any: [confirm_pending_proposal], writes: 1, db: {tickets: 1}}

