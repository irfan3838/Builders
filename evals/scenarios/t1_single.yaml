# Tier 1: one action, 1-3 turns, the way people actually say it. Seed business date: Sat 21 Nov 2026.

- id: t1_meetings_today
  tier: 1
  who: employee
  turns:
    - say: "aaj meri meetings kya hai"
      expect: {tools_any: [list_meetings], reply_any: ["pipeline", "Q3"]}

- id: t1_travel_left
  tier: 1
  who: priya
  turns:
    - say: "how much is left in travel this month"
      expect: {tools_any: [get_budget_month, get_budget_status], reply_any: ["₹", "travel"]}

- id: t1_whats_pending
  tier: 1
  who: priya
  turns:
    - say: "kya pending hai aaj"
      expect: {tools_any: [get_attention_items, get_briefing], reply_any: ["Lotus", "invoice", "reminder", "leave", "claim", "approv"]}

- id: t1_revenue_overview
  tier: 1
  who: priya
  turns:
    - say: "revenue kaisa chal raha hai is mahine"
      expect: {tools_any: [get_revenue_overview], reply_any: ["₹"]}

