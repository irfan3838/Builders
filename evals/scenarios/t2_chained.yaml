# Tier 2: small actions chaining into bigger tasks (4-8 turns). Measures context growth turn by turn.

- id: t2_briefing_to_payment_to_reminder
  tier: 2
  who: priya
  turns:
    - say: "good morning, brief me"
      expect: {tools_any: [get_briefing, get_attention_items]}
    - say: "kya pending hai revenue mein"
      expect: {tools_any: [get_revenue_suggestions, get_attention_items, list_client_invoices]}
    - say: "Acme Traders ka November wala 38 hazaar aa gaya"
      expect: {tools_any: [propose_payment], cards_any: [proposal], writes: 0}
    - say: "haan"
      expect: {tools_any: [confirm_pending_proposal], writes: 1, db: {invoice_payments: 1}}
    - say: "aur October wale ke liye Friday ko reminder daal do"
      expect: {tools_any: [add_reminder], db: {reminders: 1}, reply_any: ["Friday", "27"]}

- id: t2_part_payment_then_move_balance
  tier: 2
  who: priya
  turns:
    - say: "Northwind se 40 hazaar aur aaye hai October ke, baaki baad mein aayega"
      expect: {tools_any: [propose_payment], writes: 0}
    - say: "yes confirm"
      expect: {tools_any: [confirm_pending_proposal], writes: 1, db: {invoice_payments: 1}}
    - say: "baaki amount December ke invoice mein daal do"
      expect: {tools_any: [propose_balance_move], writes: 0}
    - say: "theek hai"
      expect: {tools_any: [confirm_pending_proposal], writes: 1}

- id: t2_lotus_balance_and_reminder_done
  tier: 2
  who: priya
  turns:
    - say: "Lotus Hospitality ka baaki 27,200 aa gaya"
      expect: {tools_any: [propose_payment], writes: 0, reply_any: ["27,200"]}
    - say: "haan kar do"
      expect: {tools_any: [confirm_pending_proposal], writes: 1, db: {invoice_payments: 1}}
    - say: "Lotus wala reminder bhi complete kar do"
      expect: {tools_any: [complete_reminder]}

- id: t2_leave_request_flow
  tier: 2
