- id: t2_chart_refine
  tier: 2
  who: priya
  turns:
    - say: "show me a graph of expenses"
      expect: {cards_any: [choice, chart]}
    - say: "spend by category"
      expect: {cards_any: [choice, chart]}
    - say: "this quarter"
      expect: {cards_any: [chart, choice]}
    - say: "sirf Marketing aur Travel dikhao"
      expect: {tools_any: [revise_chart, build_chart], cards_any: [chart]}
    - say: "compare with last quarter"
      expect: {tools_any: [revise_chart, build_chart], cards_any: [chart]}

- id: t2_trip_flight_and_hotel
  tier: 2
  who: arjun
  turns:
    - say: "next week Pune se Mumbai jaana hai client meeting ke liye"
      expect: {cards_any: [choice, flight_options], writes: 0}
    - say: "monday 30th"
      expect: {tools_any: [search_flights], cards_any: [flight_options]}
    - say: "hotel bhi chahiye 30 se 2 tak"
      expect: {tools_any: [search_hotels], cards_any: [hotel_options]}
    - say: "dono mein sabse sasta wala book karo"
      expect: {tools_any: [propose_trip_booking], cards_any: [proposal], writes: 0}
    - say: "haan approve"
      expect: {tools_any: [confirm_pending_proposal], writes: 1, db: {flight_bookings: 1, hotel_bookings: 1}}

- id: t2_flight_then_book_next_turn
  tier: 2
