[project]
name = "builders"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "boto3>=1.44.7",
    "deepagents>=0.7.41",
    "fastapi",
    "filetype>=1.2.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "langsmith>=0.14.4",
    "openai>=3.57.0",
    "openai-agents>=0.25.0",
    "pillow>=13.0.0",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "pypdfium2>=5.15.2",
    "python-dotenv",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.1.9",
    "sse-starlette>=3.7.0",
    "structlog>=26.1.0",
    "uvicorn[standard]",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"
extend-exclude = [".venv", "web", "graphify-out"]

[tool.ruff.lint]
per-file-ignores = { "migrations/env.py" = ["E402"] }
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
