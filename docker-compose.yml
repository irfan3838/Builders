# Local development only. AWS uses RDS (see docs/deployment.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: munshi
      POSTGRES_PASSWORD: munshi-local-only
      POSTGRES_DB: munshi
    ports: ["5433:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./scripts/db-init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munshi"]
      interval: 2s
      retries: 20
volumes:
  pgdata:
