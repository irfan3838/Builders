# Local run. `docker compose up --build` -> Postgres + Purser (API + web UI) on http://localhost:8000.
# First start migrates and seeds synthetic demo data; later starts keep the data. Reset: `docker compose down -v`.
# Ports are overridable: APP_PORT=8100 DB_PORT=5444 docker compose up --build. AWS uses RDS (see docs/deployment.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: munshi
      POSTGRES_PASSWORD: munshi-local-only
      POSTGRES_DB: munshi
    ports: ["${DB_PORT:-5433}:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./scripts/db-init:/docker-entrypoint-initdb.d:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U munshi"]
      interval: 2s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://munshi:munshi-local-only@db:5432/munshi
      APP_ORIGIN: http://localhost:${APP_PORT:-8000}
      APP_ENV: local
      STORAGE_BACKEND: local
    ports: ["${APP_PORT:-8000}:8000"]
    volumes: [uploads:/srv/.uploads]
    command: >
      sh -c "alembic upgrade head && python -m seed.bootstrap &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --timeout-keep-alive 75"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 5s
      start_period: 60s
      retries: 30

volumes:
  pgdata:
  uploads:
